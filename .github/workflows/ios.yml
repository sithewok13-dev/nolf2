# Builds NOLF2 for iOS / iPadOS (arm64 device) and packages an UNSIGNED .ipa.
#
# The .app inside carries only an ad-hoc signature. Players sign and install it
# with a sideloading tool (SideStore, AltStore, ...). No game data is bundled,
# ever: players copy their own retail NOLF2 files into the app's folder with the
# Files app (runtime/kernel/src/sys/ios/ios_window.mm finds them there).
#
# Where the .ipa goes:
#   - a push to the `ios` branch (or a manual run with "release" empty): the
#     "ios-latest" prerelease, the newest test build
#   - a release tag (v0.1 / ios-v0.1 ...; a manual run with release=<tag>, or a
#     pushed tag): a release for that tag, with macbuild/ios/RELEASE_NOTES.md as
#     its text, marked as the latest release. A tag with a '-' in it
#     (ios-v0.2-beta1) becomes a prerelease and isn't marked latest. The run
#     stops before building if the notes have no "### What's in <tag>" line.
#
# The build: CMake (macbuild/CMakeLists.txt, LT_IOS) with the iPhone SDK and
# plain Makefiles; the NOLF2_iOS_App target lays out and ad-hoc signs NOLF2.app.

name: iOS IPA

on:
  push:
    branches:
      - ios
    tags:
      - 'v*'
      - 'ios-v*'
    # Branch pushes that only change Markdown or docs don't build. (GitHub
    # ignores path filters for tag pushes, so a tag always builds.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Leave empty to update ios-latest.
        required: false
        default: ''

concurrency:
  # One run at a time per branch or tag; a new push cancels an older branch
  # run. A release has a group of its own and is never cancelled halfway.
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release == '' }}

env:
  # The release this run publishes: a pushed release tag, or the tag a manual
  # run was asked to create; empty for ordinary branch builds.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
  IOS_DEPLOYMENT_TARGET: '17.0'
  IPA_NAME: NOLF2-ios.ipa

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release notes are for this tag
        if: env.RELEASE_TAG != ''
        run: |
          if ! grep -qxF "### What's in ${RELEASE_TAG}" macbuild/ios/RELEASE_NOTES.md; then
            echo "::error file=macbuild/ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG} and commit them first."
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          set -e
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure (CMake, iPhone SDK)
        env:
          # Read when CMake configures (macbuild/CMakeLists.txt writes them into
          # Info.plist): a new build number (CFBundleVersion) every run, so
          # sideloading tools can tell builds apart, and the release tag.
          IOS_BUNDLE_VERSION: ${{ github.run_number }}
          IOS_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -e
          cmake -S macbuild -B build-ios -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY

      - name: Build NOLF2.app
        run: |
          set -e
          # -k: keep going after an error, so one run shows every compile error.
          cmake --build build-ios --target NOLF2_iOS_App -- -k -j"$(sysctl -n hw.ncpu)" 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" = 0
          test -d build-ios/NOLF2.app

      - name: Show the errors (if the build failed)
        if: failure()
        run: |
          grep -E "error:|Error [0-9]|undefined symbol|ld: " build.log | head -200 || true

      - name: Package unsigned IPA
        run: |
          set -e
          rm -rf Payload "$IPA_NAME"
          mkdir Payload
          cp -R build-ios/NOLF2.app Payload/
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"
          plutil -p Payload/NOLF2.app/Info.plist | grep -E 'CFBundleIdentifier|CFBundleDisplayName|CFBundleExecutable|CFBundleVersion|CFBundleShortVersionString|MinimumOSVersion'
          # What is inside: the engine, Info.plist, three game modules, the
          # signature. Nothing of the game.
          unzip -l "$IPA_NAME"
          for f in Payload/NOLF2.app/Lithtech Payload/NOLF2.app/Frameworks/*.dylib; do
            file "$f"
            otool -l "$f" | grep -A4 LC_BUILD_VERSION | grep -E 'platform|minos' || true
          done

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOLF2-ios-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Publish to "ios-latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') && env.RELEASE_TAG == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: iOS latest build
          prerelease: true
          make_latest: false
          body: |
            Test build of NOLF2 for iOS, rebuilt on every push to the ios branch (run ${{ github.run_number }}, commit ${{ github.sha }}). It may be broken, and it has not been tried on a device yet.
            **NOLF2-ios.ipa** is unsigned: sign and install it with a sideloading tool such as SideStore or AltStore.
            You need your own copy of No One Lives Forever 2; no game files are included. Open the app once, then copy your game files (GAME.rez, GAME2.rez and the rest of the game folder) into Files > On My iPhone > NOLF2, and open the app again.
            If something goes wrong, the file engine.log in that same folder says what happened.
          files: ${{ env.IPA_NAME }}
          fail_on_unmatched_files: true

      - name: Publish release for the tag
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: NOLF2 for iOS ${{ env.RELEASE_TAG }}
          body_path: macbuild/ios/RELEASE_NOTES.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
          files: ${{ env.IPA_NAME }}
          fail_on_unmatched_files: true
